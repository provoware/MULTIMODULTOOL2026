name: Linux Repository Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Linux project contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository-Vertrag prüfen
        run: python3 tools/validate_repository.py

      - name: Linux-, Manifest-, XDG- und Einstellungsprüfung ausführen
        run: python3 -m src.main --validate-only

      - name: Unit- und Ereignistests ohne GUI-Abhängigkeit ausführen
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Failpoint-Matrix ausdrücklich ausführen
        run: python3 -m unittest tests.test_settings_failpoints -v

      - name: PySide6 für Offscreen-Test installieren
        run: python3 -m pip install -r requirements.txt

      - name: Offscreen-GUI- und Fehlerdialog-Test ausführen
        run: python3 -m unittest tests.test_gui_offscreen -v
