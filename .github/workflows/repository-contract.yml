name: Linux Repository Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Linux project contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository-Vertrag prüfen
        run: python3 tools/validate_repository.py

      - name: Linux-, Manifest-, XDG- und Einstellungsprüfung ausführen
        run: python3 -m src.main --validate-only

      - name: Unit-, Ereignis- und Kernregressionstests ausführen
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Papierkorbvertrag ausdrücklich prüfen
        run: python3 -m unittest tests.test_project_trash -v

      - name: Single-Instance-Vertrag ausdrücklich prüfen
        run: python3 -m unittest tests.test_single_instance -v

      - name: Parallelstart mit 20 Zweitstarts prüfen
        run: python3 -m unittest tests.test_single_instance_stress -v

      - name: Read-only Diagnosevertrag ausdrücklich prüfen
        run: python3 -m unittest tests.test_diagnostics_center -v

      - name: Failpoint-Matrix ausdrücklich prüfen
        run: python3 -m unittest tests.test_settings_failpoints -v

      - name: PySide6 für Offscreen-Test installieren
        run: python3 -m pip install -r requirements.txt

      - name: Offscreen-GUI-, Diagnose- und Fehlerdialog-Test ausführen
        run: python3 -m unittest tests.test_gui_offscreen -v

      - name: Offscreen-Papierkorbvertrag prüfen
        run: python3 -m unittest tests.test_gui_trash_contract -v
