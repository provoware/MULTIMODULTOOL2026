name: Linux Repository Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Linux project contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      SOURCE_DATE_EPOCH: "1700000000"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shellskripte und Workflowhelfer syntaktisch prüfen
        run: |
          bash -n start.sh setup.sh
          bash -n release/release-manager.sh
          bash -n release/multimodultool2026-launcher.sh
          bash -n tests/helpers/kubuntu_release_lifecycle.sh

      - name: Repository-Vertrag und Überrestprüfung ausführen
        run: python3 tools/validate_repository.py

      - name: Linux-, Manifest-, XDG- und Einstellungsprüfung ausführen
        run: python3 -m src.main --validate-only

      - name: Unit-, Ereignis- und Kernregressionstests ausführen
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Reproduzierbaren Releasebuilder ausdrücklich prüfen
        run: python3 -m unittest tests.test_release_builder -v

      - name: Atomare _save_-Releasefinalisierung ausdrücklich prüfen
        run: python3 -m unittest tests.test_finalize_release_artifacts -v

      - name: Papierkorbvertrag ausdrücklich prüfen
        run: python3 -m unittest tests.test_project_trash -v

      - name: Append-only Undo- und Redo-Journal ausdrücklich prüfen
        run: python3 -m unittest tests.test_undo_redo -v

      - name: Read-only Transaktionsübersicht ausdrücklich prüfen
        run: python3 -m unittest tests.test_transaction_overview -v

      - name: Transaktionalen Abbruch- und Wiederanlaufvertrag prüfen
        run: python3 -m unittest tests.test_run_control -v

      - name: SIGKILL-Prozessabbruchmatrix prüfen
        run: python3 -m unittest tests.test_run_control_sigkill -v

      - name: Single-Instance-Vertrag ausdrücklich prüfen
        run: python3 -m unittest tests.test_single_instance -v

      - name: Parallelstart mit 20 Zweitstarts prüfen
        run: python3 -m unittest tests.test_single_instance_stress -v

      - name: Read-only Diagnosevertrag ausdrücklich prüfen
        run: python3 -m unittest tests.test_diagnostics_center -v

      - name: Einstellungs-Failpoint-Matrix ausdrücklich prüfen
        run: python3 -m unittest tests.test_settings_failpoints -v

      - name: PySide6 für Offscreen-Test installieren
        run: python3 -m pip install -r requirements.txt

      - name: Offscreen-GUI-, Hilfe-, Tooltip- und Fehlerdialog-Test ausführen
        run: python3 -m unittest tests.test_gui_offscreen -v

      - name: Offscreen-Papierkorb-, Transaktions- und Wiederanlaufvertrag prüfen
        run: python3 -m unittest tests.test_gui_trash_contract -v
